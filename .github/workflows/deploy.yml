name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site and deployment information
        run: |
          mkdir _site
          cp index.html _site/index.html
          marker='D&eacute;ploiement : informations indisponibles en local'
          test "$(grep -Fc "$marker" _site/index.html)" -eq 1
          deployed_at="$(date -u '+%d/%m/%Y %H:%M UTC')"
          sed -i "s|$marker|D\\&eacute;ploiement pr\\&eacute;par\\&eacute; le ${deployed_at} \\&middot; Build n\\&deg; ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}|" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
